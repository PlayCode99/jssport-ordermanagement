; PHP limits for the counter, kept with the application rather than on the host.
;
; A bill posts as multipart because it carries artwork, and the stock limits
; cut those requests up without saying so: PHP reads the first thousand input
; variables and discards the rest, keeps twenty files and drops the rest, and
; refuses anything over eight megabytes outright. A bill with everything filled
; in then came back refused for fields that were plainly there, or did not come
; back at all.
;
; Every directive here is PERDIR, so PHP reads it from this file when it runs
; as FastCGI or php-fpm — which is what hosting normally uses — and the host's
; own php.ini does not have to be touched to deploy this application. Apache
; with mod_php does not read .user.ini; the same values are repeated in
; .htaccess for that case.
;
; PHP caches this file for user_ini.cache_ttl, five minutes by default, so a
; change takes that long to appear unless php-fpm is reloaded.
;
; Two things this file cannot reach:
;   - nginx's own client_max_body_size, which rejects a large upload before PHP
;     ever sees it. That one is the host's.
;   - the CLI server, which ignores .user.ini entirely.

; Above the 5MB the application itself allows, so an oversized image is turned
; away by the application with its own wording instead of being dropped by PHP
; with "failed to upload". Phone photos reach 12MB.
upload_max_filesize = 16M

; The whole request: every picture plus every field. Holds roughly 25 photos at
; the application's own 5MB ceiling.
post_max_size = 128M

; Artwork is pinned per production sheet, and a bill can have fifteen of them.
max_file_uploads = 100

; The order payload spends about 37 of these however long the bill is, since
; its two long lists travel as JSON. This is headroom for the rest of the app.
max_input_vars = 5000
max_multipart_body_parts = 5000

; Image conversions need more room than the 128M default.
memory_limit = 512M
max_execution_time = 120
max_input_time = 120

; The reason a failure was silent rather than reported: PHP wrote its startup
; warnings into the response body, so headers had already been sent and Laravel
; could not set a status — the browser got 200 and an empty page. Logged rather
; than printed, Laravel answers 413 as it means to. Laravel's own debug page is
; unaffected; it does not go through display_errors.
display_errors = Off
display_startup_errors = Off
log_errors = On
